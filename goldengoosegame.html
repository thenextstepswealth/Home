/* A subtle top veil keeps the navy/gold UI readable without changing the landscape. */
#game:after{content:"";position:absolute;left:0;right:0;top:0;height:19%;
background:linear-gradient(rgba(5,23,43,.86),rgba(5,23,43,.12),transparent);z-index:1;pointer-events:none}
.title{
 position:absolute;z-index:10;top:2.4%;left:50%;transform:translateX(-50%);
 color:#ffd965;font:900 clamp(30px,7vw,58px) Georgia,serif;
 letter-spacing:.03em;text-shadow:0 3px 7px #000b;white-space:nowrap;
}
.stats{position:absolute;z-index:11;top:10%;left:3%;right:3%;display:grid;grid-template-columns:repeat(3,1fr);gap:2.5%}
.stat{
 min-height:67px;border:2px solid #bd8a29;border-radius:12px;padding:6px 4px;
 background:linear-gradient(155deg,rgba(13,38,64,.96),rgba(4,19,35,.95));
 color:#fff;text-align:center;font-weight:900;font-size:clamp(10px,2.2vw,19px);
 box-shadow:0 4px 12px #0007
}
.stat b{display:block;color:#ffe17b;font-size:1.4em;margin-top:1px}
#goose{
 position:absolute;z-index:20;width:31%;max-width:235px;left:50%;top:28%;
 transform:translate(-50%,-50%);pointer-events:none;
 filter:drop-shadow(0 8px 7px #0008)
}
#goose svg{display:block;width:100%;height:auto}
#egg{
 position:absolute;z-index:22;width:30px;height:43px;display:none;pointer-events:none;
 transform:translate(-50%,-50%);border-radius:52% 52% 47% 47%;
 background:radial-gradient(circle at 30% 21%,#fffde8 0 8%,#ffe86b 18%,#e2ac27 47%,#965909 77%,#492805 100%);
 border:2px solid #f8df76;box-shadow:0 0 9px #ffd84d,0 0 22px #ffc52a
}
#egg:after{content:"";position:absolute;left:19%;top:14%;width:17%;height:34%;border-radius:50%;background:#fff;opacity:.82;transform:rotate(-18deg)}
#basket{
 position:absolute;z-index:21;width:31%;max-width:235px;left:50%;top:78%;
 transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 8px 7px #0009)
}
#basket svg{display:block;width:100%;height:auto}
.controls{position:absolute;z-index:30;left:5%;right:5%;bottom:4.4%;display:flex;gap:7%;justify-content:center}
button{
 width:39%;min-height:52px;border:2px solid #d19d34;border-radius:13px;
 background:linear-gradient(#0e3152,#06182b);color:#ffe078;font-weight:900;
 font-size:clamp(13px,2.6vw,22px);box-shadow:0 4px 12px #0009;pointer-events:auto
}
button:active{transform:translateY(2px)}
#help{position:absolute;z-index:30;left:50%;bottom:1.4%;transform:translateX(-50%);
color:#fff;text-shadow:0 2px 4px #000;font-size:clamp(9px,1.6vw,15px);white-space:nowrap}
#pop{position:absolute;z-index:40;left:50%;top:72%;transform:translate(-50%,-50%);
color:#ffe06a;font:900 28px Georgia;text-shadow:0 2px 5px #000;opacity:0;pointer-events:none}
#message{
 position:absolute;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
 padding:18px 28px;border:2px solid #d2a03a;border-radius:16px;background:#06182ced;
 color:#ffe078;font:bold 27px Georgia;text-align:center;box-shadow:0 8px 25px #0009
}
#message small{display:block;color:#fff;font:14px Arial;margin-top:7px}
@media(max-width:600px){
 #game{min-height:720px}
 .stat{min-height:62px}
 button{min-height:48px}
}
</style>

<body>
<div id="game">
  <div class="title">GOLDEN GOOSE</div>
  <div class="stats">
    <div class="stat">SCORE<b id="score">$0</b></div>
    <div class="stat">GOLDEN EGGS<b id="eggs">0</b></div>
    <div class="stat">MISSED<b id="missed">0 / 5</b></div>

  <!-- Animated gameplay layer: goose is NOT part of the background. -->
  <div id="goose">

<script>
(()=>{
const game=document.getElementById("game");
const goose=document.getElementById("goose"),egg=document.getElementById("egg"),basket=document.getElementById("basket");
const msg=document.getElementById("message"),pop=document.getElementById("pop");
const scoreEl=document.getElementById("score"),eggsEl=document.getElementById("eggs"),missedEl=document.getElementById("missed");
let running=false,score=0,caught=0,missed=0,last=0;
let gx=.50,gTarget=.50,gDir=1,gTimer=.8,eggState=null,eggTimer=.6,basketX=.50;
let left=false,right=false,drag=false,popTime=0,flap=0;

function reset(){
 running=true;score=0;caught=0;missed=0;gx=.5;gTarget=.5;gDir=1;gTimer=.7;eggTimer=.55;eggState=null;
 egg.style.display="none";basketX=.5;setBasket(.5);msg.style.display="none";hud();
}
function hud(){
 scoreEl.textContent="$"+score;eggsEl.textContent=caught;missedEl.textContent=missed+" / 5";
}
function setBasket(v){basketX=Math.max(.08,Math.min(.92,v));basket.style.left=(basketX*100)+"%"}
function spawnEgg(){
 eggState={x:gx,y:.31,vy:.34+Math.random()*.05,rot:0};
 egg.style.display="block";
}
function update(dt){
 if(!running)return;

 const move=(left?-1:0)+(right?1:0);
 if(move)setBasket(basketX+move*dt*.72);

 // Goose flies continuously across the entire play field.
 gx+=gDir*dt*.27;
 if(gx>=.88){gx=.88;gDir=-1}
 if(gx<=.12){gx=.12;gDir=1}
 gTimer-=dt;
 if(gTimer<=0){gTarget=.12+Math.random()*.76;gTimer=1.2+Math.random()*1.2}
 gx+=(gTarget-gx)*Math.min(1,dt*.35);
 if(Math.abs(gTarget-gx)>.002)gDir=gTarget>gx?1:-1;

 // Eggs are spawned only at the goose.
 eggTimer-=dt;
 if(!eggState && eggTimer<=0){spawnEgg();eggTimer=Math.max(.55,.9-score*.001)}

 if(eggState){
   eggState.y+=eggState.vy*dt;eggState.rot+=dt*2.2;
   egg.style.left=(eggState.x*100)+"%";egg.style.top=(eggState.y*100)+"%";
   egg.style.transform="translate(-50%,-50%) rotate("+eggState.rot+"rad)";

   // Basket center and generous catch window. The egg physically reaches this y.
   const dy=eggState.y-.775,dx=Math.abs(eggState.x-basketX);
   if(dy>=0 && dy<=.075 && dx<=.135){
      caught++;score+=10;hud();eggState=null;egg.style.display="none";popTime=.45;
   }else if(eggState.y>=.94){
      missed++;hud();eggState=null;egg.style.display="none";
      if(missed>=5){
        running=false;
        msg.innerHTML="<b>GAME OVER</b><small>Golden Eggs Caught: "+caught+"<br>Tap to play again</small>";
        msg.style.display="block";
      }
   }
 }
 if(popTime>0){popTime-=dt;pop.style.opacity=Math.min(1,popTime*4);pop.style.top="70%";}else pop.style.opacity=0;

 flap+=dt*9;
 goose.style.left=(gx*100)+"%";
 goose.style.top=(28+Math.sin(flap)*.55)+"%";
 goose.style.transform="translate(-50%,-50%) scaleX("+(gDir<0?-1:1)+")";
}

function loop(t){const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);requestAnimationFrame(loop)}

function hold(id,k){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});
 ["pointerup","pointercancel","pointerleave"].forEach(v=>b.addEventListener(v,()=>keys[k]=false));
}
const keys={l:false,r:false};
hold("left","l");hold("right","r");
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){keys.l=true}
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){keys.r=true}
 if(!running&&(e.key==="Enter"||e.key===" "))reset();
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.l=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.r=false;
});
game.addEventListener("pointerdown",e=>{
 if(e.target.tagName==="BUTTON")return;
 if(!running){reset();return}
 drag=true;pointerMove(e);
});
game.addEventListener("pointermove",e=>{if(drag)pointerMove(e)});
addEventListener("pointerup",()=>drag=false);
function pointerMove(e){const r=game.getBoundingClientRect();setBasket((e.clientX-r.left)/r.width)}
msg.addEventListener("click",reset);
hud();setBasket(.5);goose.style.left="50%";requestAnimationFrame(loop);
})();
</script>
</body>
</html>
