<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Retro Ring · Version 4.0.0</title>
<style>
:root{--red:#ff4747;--blue:#41c7f4;--gold:#ffd56a;--ink:#080d17;--panel:#171e2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b13;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;pointer-events:none;text-shadow:0 2px 3px #000}
.name{font-weight:900;font-size:clamp(10px,2.8vw,14px);letter-spacing:1px;margin-bottom:5px;white-space:nowrap}.right{text-align:right}
.bar{height:13px;border:2px solid #f7e6bc;background:#202b3a;box-shadow:0 2px 0 #000;border-radius:2px;overflow:hidden}
.fill{height:100%;width:100%;transition:width .12s linear}.redfill{background:linear-gradient(#ff7770,#d72b38)}.bluefill{background:linear-gradient(#79edff,#1684d3)}
#round{text-align:center;min-width:68px;font-size:10px;font-weight:900;letter-spacing:1px;border:1px solid #465061;background:#111824;padding:6px;border-radius:4px}
#timer{font-size:21px;font-weight:1000;text-align:center;line-height:1.3}
#callout{position:absolute;top:24%;width:100%;text-align:center;font-weight:1000;font-size:clamp(24px,6vw,40px);font-style:italic;letter-spacing:2px;color:#fff;text-shadow:3px 4px 0 #c82a3c,0 0 15px #fff;pointer-events:none;opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s}
#callout.show{opacity:1;transform:scale(1)}
#controls{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));padding:0 16px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(42px,58px));grid-template-rows:repeat(2,52px);gap:7px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(54px,76px));grid-template-rows:repeat(2,52px);gap:7px}
button{border:1px solid #687487;border-radius:10px;color:white;background:linear-gradient(#2a3546,#101722);box-shadow:0 4px 0 #05070b, inset 0 1px 0 #ffffff22;font-weight:900;font-size:11px;letter-spacing:.5px;text-shadow:0 1px 2px #000;touch-action:none}
button:active,button.pressed{transform:translateY(3px);box-shadow:0 1px 0 #05070b,inset 0 1px 0 #ffffff22;filter:brightness(1.3)}
#up{grid-column:2}#left{grid-column:1}#duck{grid-column:2}#right{grid-column:3}
#head{background:linear-gradient(#d94753,#81202c);border-color:#ff8e91}#body{background:linear-gradient(#b98c3b,#62451c);border-color:#f6d18b}#block{background:linear-gradient(#1685a5,#124052);border-color:#6fe8ff}
#footer{position:absolute;bottom:max(4px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:9px;letter-spacing:1.5px;color:#aeb9c9;opacity:.65;pointer-events:none}
#start{position:absolute;inset:0;background:linear-gradient(180deg,#08101d 0%,#15283b 55%,#090e18 100%);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
#startCard{max-width:430px;width:100%;border:1px solid #526176;border-radius:18px;background:#0c1421eF;padding:25px 22px;box-shadow:0 18px 70px #0009}
.logo{font-weight:1000;font-size:clamp(32px,9vw,54px);line-height:.95;letter-spacing:-2px;color:#fff;text-shadow:4px 4px 0 #cf2e40,-2px -2px 0 #32bde9}
.sub{margin:13px 0 20px;color:#cbd6e5;font-size:12px;letter-spacing:2px;font-weight:800}
#start button{padding:15px 28px;width:100%;font-size:15px;background:linear-gradient(#f24d54,#9d1e2d);border-color:#ff9da1}
.small{font-size:11px;color:#9caabd;line-height:1.5;margin-top:14px}
@media(max-height:600px){#controls{bottom:12px}.pad,.actions{grid-template-rows:42px 42px}#callout{top:20%}.sub{margin:8px 0 12px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div><div class="name">YOU · RED CORNER</div><div class="bar"><div id="hp1" class="fill redfill"></div></div></div>
 <div><div id="round">ROUND 1 / 3</div><div id="timer">3:00</div></div>
 <div class="right"><div class="name">CHALLENGER · BLUE</div><div class="bar"><div id="hp2" class="fill bluefill"></div></div></div>
</div>
<div id="callout">FIGHT!</div>
<div id="controls">
 <div class="pad">
  <button id="up" data-act="up">UP</button><button id="left" data-act="left">LEFT</button><button id="duck" data-act="duck">DUCK</button><button id="right" data-act="right">RIGHT</button>
 </div>
 <div class="actions">
  <button id="head" data-act="head">HEAD</button><button id="body" data-act="body">BODY</button><button id="block" data-act="block">BLOCK</button><button id="dodge" data-act="dodge">DODGE</button>
 </div>
</div>
<div id="footer">RETRO RING · VERSION 4.0.0 · ARCADE MODE</div>
<div id="start"><div id="startCard"><div class="logo">RETRO<br>RING</div><div class="sub">ARCADE BOXING · VERSION 4.0.0</div><button id="startBtn">START FIGHT</button><div class="small">Classic 2D arcade presentation · Touch controls · Built for mobile Safari</div></div></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,dpr=1,playing=false,last=0,elapsed=0,timeLeft=180,round=1,shake=0,calloutTimer=0,flash=0;
const hp1=document.getElementById('hp1'),hp2=document.getElementById('hp2'),timerEl=document.getElementById('timer'),callout=document.getElementById('callout'),start=document.getElementById('start');
const keys={};
const p={x:.30,hp:100,stun:0,guard:0,dodge:0,duck:0,punch:0,punchType:'head',walk:0,hit:0,face:1,energy:100};
const e={x:.70,hp:100,stun:0,guard:0,dodge:0,duck:0,punch:0,punchType:'head',walk:0,hit:0,face:-1,energy:100,ai:1.3};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function gradient(x,y,h,c1,c2){let g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function drawArena(){ 
 const horizon=H*.49, floor=H*.69;
 ctx.fillStyle=gradient(0,0,H*.58,'#0b1424','#1c3244');ctx.fillRect(0,0,W,H*.59);
 // arena spotlights
 for(let i=0;i<5;i++){let x=W*(.08+i*.21);ctx.save();ctx.globalAlpha=.08;poly([[x-12,0],[x+12,0],[x+W*.14,horizon],[x-W*.14,horizon]],'#d6f4ff');ctx.restore();ellipse(x,8,18,7,'#d8f2ff')}
 // audience tiers with stylized silhouettes
 ctx.fillStyle='#111a27';ctx.fillRect(0,H*.43,W,H*.28);
 for(let row=0;row<4;row++){let y=H*(.46+row*.047);for(let i=0;i<Math.ceil(W/13);i++){let x=i*13+(row%2)*6;let colors=['#a94b4c','#c18a5c','#496d7b','#b4b8bd','#4a7d66','#5d536e'];let c=colors[(i*7+row*3)%colors.length];ellipse(x,y,3.3,4.3,c);rounded(x-3,y+3,6,8,2,c)}}
 // ring platform
 const top=H*.70;
 poly([[0,top],[W,top],[W,H*.86],[0,H*.86]],gradient(0,top,H*.16,'#dce2e9','#778a9d'));
 ctx.strokeStyle='#38475a';ctx.lineWidth=2;
 for(let i=0;i<9;i++){let x=W*i/8;ctx.beginPath();ctx.moveTo(W*.5+(x-W*.5)*.18,top);ctx.lineTo(x,H*.86);ctx.stroke()}
 for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(0,top+(H*.14)*j/3);ctx.lineTo(W,top+(H*.14)*j/3);ctx.strokeStyle='#8b9aab';ctx.stroke()}
 // apron
 ctx.fillStyle='#121a26';ctx.fillRect(0,H*.86,W,H*.045);ctx.fillStyle='#29384b';ctx.fillRect(0,H*.86,W,H*.008);
 // ropes drawn behind and in front of fighters in separate pass
 drawRopes(false);
}
function drawRopes(front){let ys=front?[.65,.685,.72]:[.45,.485,.52];for(let i=0;i<ys.length;i++){let y=H*ys[i];ctx.lineCap='round';ctx.strokeStyle='#05080e';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,y+2);ctx.lineTo(W,y+2);ctx.stroke();ctx.strokeStyle=front?(i===2?'#ef4c53':'#e9edf4'):(i===0?'#47d9f7':'#dbe2eb');ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawFighter(f,isPlayer,now){
 const x=W*f.x, base=H*.705, s=Math.min(W/390,H/780)*1.05;
 const facing=isPlayer?1:-1, skin=isPlayer?'#b86e48':'#c88762', skinLight=isPlayer?'#f0b083':'#f4c09a', trunks=isPlayer?'#d82c3d':'#145b9d', accent=isPlayer?'#ffdc65':'#d9f3ff', glove=isPlayer?'#ff3944':'#0d8de0', dark=isPlayer?'#4a2020':'#17324a';
 let bob=Math.sin(now*7+(isPlayer?0:1.7))*2*s, lean=f.punch>0?Math.sin((1-f.punch)*Math.PI)*12*s*facing:0;
 if(f.hit>0)lean-=f.hit*8*s*facing;
 ctx.save();ctx.translate(x+lean,base+bob);ctx.scale(s,s);
 // ground shadow
 ellipse(0,0,54,9,'#17202b55');
 // legs behind shorts; stride changes during movement
 let stride=Math.sin(now*7+(isPlayer?0:2))*f.walk*8;
 const leg=(lx,off)=>{ctx.save();ctx.translate(lx,0);ctx.rotate(off*.015);rounded(-10, -62,20,65,8,gradient(0,-62,65,skinLight,skin));rounded(-12,-7,26,13,5,'#191d25');poly([[-14,-3],[15,-3],[23,7],[-17,7]],'#101721');ctx.restore()};
 leg(-17,-stride);leg(17,stride);
 // trunks and waistband
 poly([[-36,-112],[36,-112],[40,-66],[2,-61],[0,-80],[-4,-61],[-40,-66]],trunks,'#101723');
 ctx.fillStyle=accent;ctx.fillRect(-37,-113,74,8);
 // shorts side panels
 poly([[-36,-108],[-20,-108],[-22,-70],[-39,-68]],accent);
 poly([[20,-108],[36,-108],[39,-68],[22,-70]],accent);
 // torso silhouette with shoulder caps
 poly([[-34,-177],[-48,-168],[-52,-142],[-39,-115],[-23,-107],[23,-107],[39,-115],[52,-142],[48,-168],[34,-177]],gradient(0,-177,70,skinLight,skin),'#3b2b2b');
 ellipse(-29,-165,18,18,skinLight,'#3b2b2b');ellipse(29,-165,18,18,skinLight,'#3b2b2b');
 // chest shading / abs
 poly([[-24,-160],[0,-151],[24,-160],[20,-124],[0,-119],[-20,-124]],isPlayer?'#c77a55':'#d99a74');
 ctx.strokeStyle='#7e4b3d';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-151);ctx.lineTo(0,-121);ctx.moveTo(-17,-137);ctx.lineTo(-3,-137);ctx.moveTo(3,-137);ctx.lineTo(17,-137);ctx.stroke();
 // arms are hinged at shoulders and swing toward guard/punch
 const phase=f.punch>0?Math.sin((1-f.punch)*Math.PI):0;
 function arm(side){ctx.save();ctx.translate(side*38,-161);let angle=side===facing?-.75:.42;if(f.guard>0)angle=-1.2;if(f.duck>0)angle=.9;if(f.punch>0&&side===facing)angle=-.2-phase*1.2;
 ctx.rotate(angle*side);rounded(-10,0,20,42,9,gradient(0,0,42,skinLight,skin),'#5b3430');ellipse(0,39,12,12,skin,'#5b3430');
 ctx.translate(0,48);let ga=-.18;if(f.punch>0&&side===facing){ctx.translate(0,-phase*40);ga=-.3}
 ctx.rotate(ga);ellipse(0,0,19,18,glove,'#501d28');ellipse(-5,-6,9,5,'#ffffff55');rounded(-12,10,24,7,3,accent);ctx.restore()}
 arm(-1);arm(1);
 // neck
 rounded(-12,-192,24,24,6,skinLight,'#5b3430');
 // head with hair and ears
 ellipse(0,-211,30,33,skinLight,'#5b3430');ellipse(-30,-210,5,8,skin);ellipse(30,-210,5,8,skin);
 // hair cap + swept spikes
 ellipse(0,-233,31,16,isPlayer?'#30221d':'#3a261d');poly([[-30,-231],[-21,-249],[-4,-246],[8,-252],[23,-244],[31,-231],[19,-225],[-20,-225]],isPlayer?'#30221d':'#3a261d');
 // face facing opponent, eyes, brows, nose, grin
 const eyeX=facing*9;
 ellipse(eyeX-5,-214,3,4,'#fff');ellipse(eyeX+7,-214,3,4,'#fff');ellipse(eyeX-4,-214,1.7,2.5,'#17202b');ellipse(eyeX+8,-214,1.7,2.5,'#17202b');
 ctx.strokeStyle='#2b1b17';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-17,-222);ctx.lineTo(-4,-224);ctx.moveTo(4,-224);ctx.lineTo(17,-222);ctx.stroke();
 poly([[-4,-206],[0,-201],[5,-206]],skin,'#7e4b3d');
 if(isPlayer){ctx.strokeStyle='#5a2423';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-195);ctx.lineTo(10,-195);ctx.stroke();rounded(-12,-198,24,5,2,'#f4e8d9')}
 else{ctx.strokeStyle='#6b3024';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-196);ctx.lineTo(10,-196);ctx.stroke()}
 // cheek marks and small gloves logo
 ellipse(-18,-205,4,2,'#e88b76');ellipse(18,-205,4,2,'#e88b76');
 ctx.restore();
}
function draw(now){
 ctx.clearRect(0,0,W,H);drawArena();
 // ring ropes in back, boxers, then lower front ropes (kept below gloves/face zone)
 drawFighter(p,true,now);drawFighter(e,false,now);drawRopes(true);
 // vignette and arcade scanline gloss
 let vg=ctx.createRadialGradient(W/2,H*.52,Math.min(W,H)*.2,W/2,H*.52,Math.max(W,H)*.8);vg.addColorStop(0,'#00000000');vg.addColorStop(1,'#03060c55');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(flash>0){ctx.fillStyle=`rgba(255,245,210,${flash*.15})`;ctx.fillRect(0,0,W,H)}
}
function announce(t){callout.textContent=t;callout.classList.add('show');calloutTimer=1.05}
function attack(f,target,type){if(!playing||f.punch>0||f.stun>0)return;f.punch=1;f.punchType=type;f.energy=Math.max(0,f.energy-8);setTimeout(()=>{},0);const hitChance=Math.random();if(hitChance>.2){target.hp=Math.max(0,target.hp-(type==='head'?7:4));target.hit=.85;target.stun=.18;shake=.7;flash=.5;announce(type==='head'?'SMACK!':'BODY SHOT!')} }
function act(a){if(!playing)return;
 if(a==='head'||a==='body'){attack(p,e,a);return}
 if(a==='block'){p.guard=.8;return}
 if(a==='dodge'){p.dodge=.65;p.x=Math.max(.18,p.x-.035);return}
 if(a==='duck'){p.duck=.7;return}
 if(a==='left')p.x=Math.max(.20,p.x-.035);
 if(a==='right')p.x=Math.min(.43,p.x+.035);
 if(a==='up')p.x=Math.max(.18,p.x-.012);
}
document.querySelectorAll('button[data-act]').forEach(b=>{
 const a=b.dataset.act;const down=ev=>{ev.preventDefault();b.classList.add('pressed');act(a);if(a==='block'||a==='duck'||a==='dodge'){keys[a]=true}};
 const up=ev=>{ev.preventDefault();b.classList.remove('pressed');keys[a]=false};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.getElementById('startBtn').addEventListener('click',()=>{start.style.display='none';playing=true;timeLeft=180;announce('FIGHT!');last=performance.now()});
function update(dt,now){
 elapsed+=dt;if(calloutTimer>0){calloutTimer-=dt;if(calloutTimer<=0)callout.classList.remove('show')}
 if(shake>0)shake=Math.max(0,shake-dt*2);if(flash>0)flash=Math.max(0,flash-dt*2);
 for(const f of [p,e]){f.punch=Math.max(0,f.punch-dt*2.3);f.hit=Math.max(0,f.hit-dt*2.4);f.stun=Math.max(0,f.stun-dt);f.guard=Math.max(0,f.guard-dt*1.8);f.dodge=Math.max(0,f.dodge-dt*1.8);f.duck=Math.max(0,f.duck-dt*1.8);f.walk=Math.max(0,f.walk-dt*3)}
 if(playing){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;playing=false;announce('ROUND OVER')}
   e.ai-=dt;if(e.ai<=0&&e.stun<=0){if(Math.random()<.66)attack(e,p,Math.random()<.68?'head':'body');else{e.guard=.45;e.dodge=.4}e.ai=.8+Math.random()*1.2}
   if(keys.block)p.guard=.1;if(keys.duck)p.duck=.1;if(keys.dodge)p.dodge=.1;
   p.walk=Math.max(p.walk,keys.left||keys.right?.7:0);e.walk=Math.max(e.walk,.35);
 }
 hp1.style.width=p.hp+'%';hp2.style.width=e.hp+'%';timerEl.textContent=Math.floor(timeLeft/60)+':'+String(Math.floor(timeLeft%60)).padStart(2,'0');
 if(p.hp<=0||e.hp<=0){playing=false;announce(e.hp<=0?'KNOCKOUT!':'YOU GOT KNOCKED OUT')}
}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(playing)update(dt,t/1000);else{for(const f of [p,e]){f.walk=.2;f.punch=Math.max(0,f.punch-dt*2);f.hit=Math.max(0,f.hit-dt*2)}}draw(t/1000);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
